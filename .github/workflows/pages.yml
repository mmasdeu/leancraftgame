# Publishes the landing page (site/) to the gh-pages branch, which GitHub Pages serves at
# https://mmasdeu.github.io/DefGame/. Runs when the page changes, or by hand.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root). The branch is created by the first run of this workflow.

name: Landing page

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish site/ to the gh-pages branch
        run: |
          cp -r site "$RUNNER_TEMP/pages"
          touch "$RUNNER_TEMP/pages/.nojekyll"        # serve the files as they are
          cd "$RUNNER_TEMP/pages"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Landing page from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
